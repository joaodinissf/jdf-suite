[tool.uv]
# Only resolve releases at least 3 days old; certifi is exempt until the
# 2026.10.19 eMudhra fix (CVE-2026-111943) ages past the window.
exclude-newer = "3 days"
exclude-newer-package = { certifi = "2026-10-23T00:00:00Z" }

[tool.uv.workspace]
# Glob over `packages/*` and prune directories that aren't Python workspace
# members (Chrome extensions, userscripts, AppleScript, etc.). Every new
# non-Python package must be added here. See jdf-suite#12.
members = ["packages/*"]
exclude = ["packages/jdf-tab-huddle", "packages/jdf-stt-app", "packages/jdf-skill-library", "packages/jdf-keepalive"]

# Hooks run from the git root and ty reads its config from the cwd, so the
# per-package exclude must be repeated here. See packages/jdf-hooks/pyproject.toml.
[tool.ty.src]
exclude = ["packages/jdf-hooks/tests/integration/example_files/"]
