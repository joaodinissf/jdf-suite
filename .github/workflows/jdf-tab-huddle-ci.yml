name: jdf-tab-huddle CI
on:
  push:
    branches: [main]
    paths:
    - packages/jdf-tab-huddle/**
    - .github/workflows/jdf-tab-huddle-ci.yml
  pull_request:
    branches: [main]
    paths:
    - packages/jdf-tab-huddle/**
    - .github/workflows/jdf-tab-huddle-ci.yml

defaults:
  run:
    working-directory: packages/jdf-tab-huddle

jobs:
  lint-and-test:
    name: Lint + unit tests + manifest validate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: packages/jdf-tab-huddle/pnpm-lock.yaml
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Lint
      run: pnpm run lint
    - name: Unit tests
      run: pnpm test
    - name: Validate manifest
      run: pnpm run validate

  e2e:
    name: E2E (Playwright, headless extension)
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: packages/jdf-tab-huddle/pnpm-lock.yaml
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Read the Playwright version
      id: playwright
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    # The browser build is pinned by the Playwright version, so that version
    # is the whole cache key.
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - name: Install Playwright Chromium
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium
    # A cache hit restores the browser but not its system libraries.
    - name: Install Playwright system dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium
    - name: Run e2e tests
      run: pnpm run test:e2e
    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: playwright-results
        path: packages/jdf-tab-huddle/test-results/
        retention-days: 7
