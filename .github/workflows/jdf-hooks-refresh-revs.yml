name: jdf-hooks refresh revs
on:
  schedule:
  - cron: '0 6 1 * *'   # monthly, 1st at 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/jdf-hooks
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
    # Exact version, >= 3 days old when chosen; bump by hand (Dependabot doesn't
    # track it). The cutoff also caps pre-commit's transitive deps.
    - run: uv tool install pre-commit==4.7.0
      env:
        UV_EXCLUDE_NEWER: '2026-11-17T00:00:00Z'
    - name: Refresh pre-commit revs in the bundled fragments
      run: uv run python scripts/refresh_revs.py
    - name: Run unit tests against the refreshed fragments
      run: uv run --extra dev pytest tests/test_generate.py -q
    - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
      with:
        commit-message: 'chore(hooks): refresh pre-commit revs'
        title: 'chore(hooks): refresh pre-commit revs'
        body: |
          Monthly `pre-commit autoupdate` over the bundled fragments (`scripts/refresh_revs.py`).
          Review the pins, then merge; jdf-hooks users pick them up via `jdf-hooks update`.
        branch: jdf-hooks/refresh-revs
        delete-branch: true
        labels: dependencies
