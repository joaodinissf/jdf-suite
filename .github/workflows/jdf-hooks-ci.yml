name: jdf-hooks CI
on:
  push:
    branches: [main]
    paths:
    - packages/jdf-hooks/**
    - .github/workflows/jdf-hooks-ci.yml
    - uv.lock
    - pyproject.toml
  pull_request:
    branches: [main]
    paths:
    - packages/jdf-hooks/**
    - .github/workflows/jdf-hooks-ci.yml
    - uv.lock
    - pyproject.toml

defaults:
  run:
    working-directory: packages/jdf-hooks

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14'
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    - run: uv run --extra dev pytest -v
    - name: Own hooks are in sync with the bundled templates (dogfooding)
      run: uv run jdf-hooks check --offline

  integration:
    name: Integration (${{ matrix.manager }})
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        manager: [precommit, lefthook]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14'
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '20'
    - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      with:
        toolchain: stable
        components: rustfmt, clippy
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: '21'
    - name: Install shfmt
      run: sudo apt-get update && sudo apt-get install -y shfmt
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    - name: Install lefthook toolchain
      if: matrix.manager == 'lefthook'
      run: |
        npm install -g lefthook prettier markdownlint-cli
        uv tool install pycln
        uv tool install isort
        uv tool install ruff
        uv tool install ty
        uv tool install yamlfix
        uv tool install sqlfluff
        cargo install taplo-cli
    - name: Run integration test
      run: uv run python tests/integration/test_${{ matrix.manager }}.py

  validate-config:
    name: Validate lefthook config
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: npm install -g lefthook
    - name: Validate lefthook.yml
      # Lefthook resolves its config relative to the git root, not CWD,
      # so in a monorepo we must point it at the per-package config via
      # the LEFTHOOK_CONFIG env var (there's no -c/--config CLI flag).
      env:
        LEFTHOOK_CONFIG: packages/jdf-hooks/lefthook.yml
      run: lefthook dump
