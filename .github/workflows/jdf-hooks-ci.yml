name: jdf-hooks CI
on:
  push:
    branches: [main]
    paths:
    - packages/jdf-hooks/**
    - .github/workflows/jdf-hooks-ci.yml
    - uv.lock
    - pyproject.toml
  pull_request:
    branches: [main]
    paths:
    - packages/jdf-hooks/**
    - .github/workflows/jdf-hooks-ci.yml
    - uv.lock
    - pyproject.toml

defaults:
  run:
    working-directory: packages/jdf-hooks

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14'
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
    - run: uv run --extra dev pytest -v
    - name: Own hooks are in sync with the bundled templates (dogfooding)
      run: uv run jdf-hooks check --offline

  integration:
    name: Integration (${{ matrix.manager }})
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        manager: [precommit, lefthook]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14'
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '20'
    # rustup ships on the GitHub-hosted Ubuntu images, so install an exact
    # toolchain with it instead of a third-party action pinned to a branch head
    # that Dependabot can't bump. Bump the version by hand (>= 3 days old).
    - name: Install Rust toolchain
      run: |
        rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy
        rustup default 1.100.0
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: '21'
    - name: Install shfmt
      run: sudo apt-get update && sudo apt-get install -y shfmt
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
    # Exact versions, each >= 3 days old when chosen. Dependabot doesn't track
    # these, so bump them by hand. The cutoff date caps transitive deps too
    # (npm --before, uv --exclude-newer); keep it >= the newest pin's date.
    - name: Install lefthook toolchain
      if: matrix.manager == 'lefthook'
      env:
        npm_config_before: '2026-11-17T00:00:00Z'
        UV_EXCLUDE_NEWER: '2026-11-17T00:00:00Z'
      run: |
        npm install -g lefthook@2.2.2 prettier@3.10.1 markdownlint-cli@0.50.0
        uv tool install pycln==2.6.1
        uv tool install isort==9.0.2
        uv tool install ruff==0.17.5
        uv tool install ty==0.0.104
        uv tool install yamlfix==1.19.1
        uv tool install sqlfluff==4.5.0
        cargo install --locked --version 0.10.0 taplo-cli
    - name: Run integration test
      run: uv run python tests/integration/test_${{ matrix.manager }}.py

  validate-config:
    name: Validate lefthook config
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: npm install -g lefthook@2.2.2  # keep in step with the integration job
      env:
        npm_config_before: '2026-11-17T00:00:00Z'
    - name: Validate lefthook.yml
      # Lefthook resolves its config relative to the git root, not CWD,
      # so in a monorepo we must point it at the per-package config via
      # the LEFTHOOK_CONFIG env var (there's no -c/--config CLI flag).
      env:
        LEFTHOOK_CONFIG: packages/jdf-hooks/lefthook.yml
      run: lefthook dump
