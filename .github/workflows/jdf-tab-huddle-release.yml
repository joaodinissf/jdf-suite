name: jdf-tab-huddle Release
on:
  push:
    tags: ['jdf-tab-huddle-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build a Release for (backfill), e.g. jdf-tab-huddle-v0.4.1
        required: true
      dry_run:
        description: Build and test only; publish nothing
        type: boolean
        default: false

# The tooling (this workflow, scripts/release-notes.sh) comes from the commit
# the workflow runs at; everything released (code, versions, README entry)
# comes from the tag, checked out under tagged/. That keeps backfills of tags
# older than this workflow working.
defaults:
  run:
    working-directory: tagged/packages/jdf-tab-huddle

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Runs the tag's dev dependencies, so it gets a read-only token and keeps
  # no credentials in git config.
  build:
    name: Test and package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      latest: ${{ steps.latest.outputs.latest }}
      highest: ${{ steps.latest.outputs.highest }}
    steps:
    - name: Check out the release tooling
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        path: tools
        persist-credentials: false
    - name: Check out the tag being released
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        ref: ${{ env.TAG }}
        path: tagged
        # Full history and tags: the notes list commits since the previous tag.
        fetch-depth: 0
        persist-credentials: false
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 10.34.6
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: tagged/packages/jdf-tab-huddle/pnpm-lock.yaml
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Lint
      run: pnpm run lint
    - name: Unit tests
      run: pnpm test
    - name: Check the tag matches the manifest and package versions
      id: version
      run: |
        version="${TAG#jdf-tab-huddle-v}"
        manifest="$(node -p "require('./src/manifest.json').version")"
        pkg="$(node -p "require('./package.json').version")"
        if [ "$version" != "$manifest" ] || [ "$version" != "$pkg" ]; then
          echo "::error::tag $TAG does not match manifest.json ($manifest) / package.json ($pkg)"
          exit 1
        fi
        echo "VERSION=$version" >> "$GITHUB_ENV"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Package the extension
      # Zipped from inside src/ so manifest.json is at the top of the zip, as
      # the Chrome Web Store expects (older tags' package scripts did not).
      run: cd src && zip -r "../jdf-tab-huddle-${VERSION}.zip" . -x 'icons/*.afphoto'
    - name: Write release notes
      run: bash "$GITHUB_WORKSPACE/tools/packages/jdf-tab-huddle/scripts/release-notes.sh" "$TAG" > release-notes.md
    - name: Mark as latest only for the highest huddle version
      id: latest
      run: |
        highest="$(git tag --list 'jdf-tab-huddle-v*' --sort=-v:refname | head -1)"
        if [ "$highest" = "$TAG" ]; then latest=true; else latest=false; fi
        echo "latest=$latest" >> "$GITHUB_OUTPUT"
        echo "highest=$highest" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release
        path: |
          tagged/packages/jdf-tab-huddle/jdf-tab-huddle-${{ env.VERSION }}.zip
          tagged/packages/jdf-tab-huddle/release-notes.md
        if-no-files-found: error

  # Holds the write token, so it checks out nothing and runs no repo code.
  publish:
    name: Publish GitHub Release
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release
    - name: Create or update the GitHub Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ env.TAG }}
        name: ${{ env.TAG }}
        body_path: release-notes.md
        files: jdf-tab-huddle-${{ needs.build.outputs.version }}.zip
        make_latest: ${{ needs.build.outputs.latest }}
    # make_latest: false alone did not stop a backfill (v0.5.0) from taking
    # Latest from v0.6.0, so a backfill hands it back to the highest version.
    - name: Keep Latest on the highest huddle version
      if: needs.build.outputs.latest == 'false'
      env:
        GH_TOKEN: ${{ github.token }}
        HIGHEST: ${{ needs.build.outputs.highest }}
      # The highest tag may not have a Release yet; that is not this run's failure.
      run: |
        gh release edit "$HIGHEST" --latest --repo "$GITHUB_REPOSITORY" \
          || echo "::warning::$HIGHEST has no Release to keep as Latest"
