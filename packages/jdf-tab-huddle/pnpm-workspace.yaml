# Refuse versions published less than 3 days (4320 minutes) ago, transitive
# ones included, so a re-lock can't pull in a release that is still young
# enough to be yanked or compromised. pnpm >= 10.16; CI runs 10.34.6.
minimumReleaseAge: 4320

# flatted <= 3.4.1 is vulnerable to prototype pollution via parse()
# (GHSA-rf6f-7fwh-wjgh). eslint reaches it through flat-cache, which since
# 6.1.23 (eslint 10.15.0) declares ^3.4.2 itself; the floor stays as a guard
# in case a re-lock or downgrade brings back an older flat-cache.
#
# A floor rather than a pin: the advisory sets a minimum, so pinning an exact
# version would block later patches without adding safety.
overrides:
  flatted: '>=3.4.2'
  # @humanfs/node < 0.16.8 recursive copy follows symlinks outside the source
  # tree (GHSA-p498-v437-472g). eslint 10.15.0 declares ^0.16.8 itself, so today
  # both bounds are guards only. Keep the cap below 0.17: 0.17 requires
  # Node >= 24 (CI runs 22), and a later eslint that moves to ^0.17 should fail
  # resolution loudly rather than silently need a newer Node.
  '@humanfs/node': '>=0.16.8 <0.17'
