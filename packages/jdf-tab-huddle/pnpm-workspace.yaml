# pnpm 11 no longer reads the "pnpm" field from package.json — settings live here.
#
# Security floor rather than a pin: flatted <= 3.4.1 is vulnerable to prototype
# pollution via parse() (GHSA-rf6f-7fwh-wjgh, Dependabot alert #13). eslint pulls
# it in transitively via flat-cache, which asks for ^3.2.9. Using >= keeps the
# floor enforced while still letting later patches through.
overrides:
  flatted: '>=3.4.2'
