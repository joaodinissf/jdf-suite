# flatted <= 3.4.1 is vulnerable to prototype pollution via parse()
# (GHSA-rf6f-7fwh-wjgh). eslint reaches it transitively through flat-cache,
# whose ^3.2.9 range is wide enough to resolve a vulnerable version.
#
# A floor rather than a pin: the advisory sets a minimum, so pinning an exact
# version would block later patches without adding safety.
overrides:
  flatted: '>=3.4.2'
