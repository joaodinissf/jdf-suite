<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Huddle — Nap room</title>
  <link rel="stylesheet" href="huddle-theme.css">
  <style>
    /* Tokens, fonts, light/dark and the tab-group chips live in
       huddle-theme.css; this sheet is the nap room's layout only. The nap
       voice is amber: the moon, the day chips and the sleeping dots. */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-size: 14px;
      line-height: 1.45;
    }

    .nap {
      padding: 40px 0 64px;
      min-height: 100vh;
    }

    .nap-inner {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .nap-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 6px;
    }

    .nap-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nap-moon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--sleep-soft);
      display: grid;
      place-items: center;
      color: var(--sleep);
      flex: 0 0 auto;
    }

    .nap-moon svg {
      width: 20px;
      height: 20px;
    }


    .nap-title h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.015em;
      line-height: 1.25;
    }

    .nap-title p#napSummary {
      margin: 2px 0 0;
      font-size: 13px;
      color: var(--tx-dim);
    }

    .nap-actions {
      display: flex;
      gap: 8px;
    }

    .textbtn {
      font: 600 12.5px/1.2 var(--ui);
      color: var(--tx);
      background: var(--comp);
      border: 1px solid var(--bd-control);
      border-radius: 7px;
      padding: 7px 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: color .12s, border-color .12s, background .12s;
    }

    .textbtn:hover:not(:disabled) {
      background: var(--comp-hi);
      border-color: var(--bd-control-hi);
    }

    .textbtn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    /* Wake all is the room's main action. */
    .textbtn.primary {
      background: var(--ac);
      border-color: var(--ac);
      color: var(--on-ac);
    }

    .textbtn.primary:hover:not(:disabled) {
      background: var(--ac-hi);
      border-color: var(--ac-hi);
    }

    /* Discard drops the tabs for good: set apart from Wake now, red only
       when you reach for it. */
    .textbtn.discard {
      color: var(--tx-dim);
      background: transparent;
      border-color: transparent;
    }

    .textbtn.discard:hover:not(:disabled),
    .textbtn.discard:focus-visible {
      color: var(--danger);
      background: transparent;
      border-color: var(--danger);
    }

    .undo-notice {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      padding: 9px 12px;
      border: 1px solid var(--bd);
      border-radius: 9px;
      background: var(--panel);
      font-size: 13.5px;
    }

    .undo-notice[hidden] {
      display: none;
    }

    .undo-notice span {
      flex: 1;
      min-width: 0;
    }

    .day {
      margin-top: 28px;
    }

    /* Day sections are tab groups in the nap colour: a yellow chip, the
       date, and the group line (see huddle-theme.css). */
    .day-h {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 10px;
      font-size: 12px;
    }

    .day-h .group-chip {
      font-size: 12px;
      padding: 2px 8px;
    }

    .day-h span.sub {
      font: 500 12px var(--mono);
      color: var(--tx-dim);
    }

    .nap-list {
      border: 1px solid var(--bd);
      border-radius: 10px;
      background: var(--panel);
      overflow: hidden;
    }

    .nap-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-bottom: 1px solid var(--bd);
      transition: background .12s;
    }

    .nap-row:last-child {
      border-bottom: 0;
    }

    .nap-row:hover {
      background: var(--comp-hi);
    }

    .nap-meta {
      flex: 1;
      min-width: 0;
    }

    .nap-t {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nap-u {
      font: 500 12px var(--mono);
      color: var(--tx-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .nap-when {
      display: flex;
      align-items: center;
      gap: 7px;
      font: 600 12px var(--mono);
      color: var(--tx-dim);
      flex: 0 0 auto;
      min-width: 72px;
      justify-content: flex-end;
    }

    .zzz {
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background: var(--sleep-fill);
      box-shadow: 0 0 0 3px var(--sleep-soft);
      flex: 0 0 auto;
    }

    /* The origin group, drawn as its Chrome group chip. */
    .group-badge {
      flex: 0 1 auto;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nap-row-actions {
      display: flex;
      gap: 4px;
      flex: 0 0 auto;
    }

    /* Narrow windows: the title and URL take the first line, the badge,
       wake time and actions wrap under them. */
    @media (max-width: 560px) {
      .nap-row {
        flex-wrap: wrap;
        row-gap: 8px;
      }

      .nap-meta {
        flex-basis: 100%;
      }

      .nap-when {
        min-width: 0;
        margin-left: auto;
      }
    }

    .empty-state {
      margin-top: 60px;
      text-align: center;
      color: var(--tx-dim);
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="nap">
    <div class="nap-inner">
      <div class="nap-head">
        <div class="nap-title">
          <span class="nap-moon" aria-hidden="true"><svg viewBox="0 0 20 20" focusable="false"><path d="M15.5 12.6A6.5 6.5 0 0 1 7.4 4.5a6.5 6.5 0 1 0 8.1 8.1Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></span>
          <div>
            <h1>Nap room</h1>
            <p id="napSummary">Nothing sleeping right now</p>
          </div>
        </div>
        <div class="nap-actions">
          <button id="wakeAll" class="textbtn wake primary">Wake all</button>
          <button id="openSettings" class="textbtn">Settings</button>
        </div>
      </div>

      <div id="discardNotice" class="undo-notice" role="status" aria-live="polite" hidden>
        <span id="discardNoticeText"></span>
        <button id="discardUndo" class="textbtn wake">Undo</button>
      </div>

      <div id="napDays"></div>
      <div id="napEmpty" class="empty-state" hidden>Nothing is sleeping right now. Snooze a tab from the popup to see it here.</div>
    </div>
  </div>

  <script src="nap-room.js"></script>
</body>

</html>
