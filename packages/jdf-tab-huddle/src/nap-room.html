<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Huddle — Nap room</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a0c;
      --panel: #111114;
      --comp: #17171b;
      --comp-hi: #202026;
      --bd: #26262c;
      --bd-hi: #3a3a42;
      --tx: #f3f4f6;
      --tx-dim: #8b8d97;
      --ac: #3aa0ff;
      --ac-hi: #59b1ff;
      --ac-soft: rgba(58, 160, 255, .15);
      --ac-txt: #7cc0ff;
      --sleep: #e0b64b;
      --sleep-soft: rgba(224, 182, 75, .15);
      --ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
      --mono: ui-monospace, 'Cascadia Code', 'Segoe UI Mono', 'SFMono-Regular', Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font-family: var(--ui);
      -webkit-font-smoothing: antialiased;
      line-height: 1.45;
    }

    .nap {
      padding: 30px 0 60px;
      min-height: 100vh;
    }

    .nap-inner {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 32px;
    }

    .nap-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 6px;
    }

    .nap-title {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .nap-moon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--sleep-soft);
      display: grid;
      place-items: center;
      color: var(--sleep);
      font-size: 18px;
      flex: 0 0 auto;
    }

    .nap-title h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 650;
      letter-spacing: -.015em;
      color: var(--tx);
    }

    .nap-title p {
      margin: 1px 0 0;
      font-size: 11.5px;
      color: var(--tx-dim);
    }

    .nap-actions {
      display: flex;
      gap: 6px;
    }

    .textbtn {
      font-family: var(--ui);
      font-size: 11px;
      font-weight: 600;
      color: var(--tx-dim);
      background: transparent;
      border: 1px solid var(--bd);
      border-radius: 6px;
      padding: 6px 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: color .12s, border-color .12s, background .12s;
    }

    .textbtn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .textbtn.wake:hover:not(:disabled) {
      color: var(--ac-txt);
      border-color: var(--ac);
      background: var(--ac-soft);
    }

    .textbtn.cancel:hover:not(:disabled) {
      color: #ff8585;
      border-color: #ff858555;
    }

    .day {
      margin-top: 22px;
    }

    .day-h {
      display: flex;
      align-items: baseline;
      gap: 9px;
      margin: 0 0 8px;
    }

    .day-h b {
      font-size: 12px;
      font-weight: 650;
      color: var(--tx);
      letter-spacing: .01em;
    }

    .day-h span.sub {
      font: 500 10.5px var(--mono);
      color: var(--tx-dim);
    }

    .day-h .rule {
      flex: 1;
      height: 1px;
      background: var(--bd);
      opacity: .6;
      align-self: center;
    }

    .nap-list {
      border: 1px solid var(--bd);
      border-radius: 10px;
      background: var(--panel);
      overflow: hidden;
    }

    .nap-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-bottom: 1px solid var(--bd);
      transition: background .12s;
    }

    .nap-row:last-child {
      border-bottom: 0;
    }

    .nap-row:hover {
      background: var(--comp);
    }

    .nap-meta {
      flex: 1;
      min-width: 0;
    }

    .nap-t {
      font-size: 12.5px;
      font-weight: 550;
      color: var(--tx);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nap-u {
      font: 500 10.5px var(--mono);
      color: var(--tx-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .nap-when {
      display: flex;
      align-items: center;
      gap: 6px;
      font: 600 10.5px var(--mono);
      color: var(--tx-dim);
      flex: 0 0 auto;
      min-width: 72px;
      justify-content: flex-end;
    }

    .zzz {
      width: 6px;
      height: 6px;
      border-radius: 99px;
      background: var(--sleep);
      box-shadow: 0 0 0 3px var(--sleep-soft);
      flex: 0 0 auto;
    }

    .group-badge {
      font: 600 9.5px var(--mono);
      color: var(--ac-txt);
      background: var(--ac-soft);
      border-radius: 99px;
      padding: 1px 7px;
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .nap-row-actions {
      display: flex;
      gap: 4px;
      flex: 0 0 auto;
    }

    .empty-state {
      margin-top: 60px;
      text-align: center;
      color: var(--tx-dim);
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="nap">
    <div class="nap-inner">
      <div class="nap-head">
        <div class="nap-title">
          <span class="nap-moon">&#9770;</span>
          <div>
            <h1>Nap room</h1>
            <p id="napSummary">Nothing sleeping right now</p>
          </div>
        </div>
        <div class="nap-actions">
          <button id="wakeAll" class="textbtn wake">Wake all</button>
          <button id="openSettings" class="textbtn">Settings</button>
        </div>
      </div>

      <div id="napDays"></div>
      <div id="napEmpty" class="empty-state" hidden>Nothing is sleeping right now. Snooze a tab from the popup to see it here.</div>
    </div>
  </div>

  <script src="nap-room.js"></script>
</body>

</html>
