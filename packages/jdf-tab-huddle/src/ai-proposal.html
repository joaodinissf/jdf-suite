<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Huddle — Organize with AI</title>
  <link rel="stylesheet" href="huddle-theme.css">
  <link rel="stylesheet" href="ai-config.css">
  <style>
    /* Tokens, fonts, light/dark and the tab-group chips live in
       huddle-theme.css; this sheet is the proposal page's layout only. */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }

    .page-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .logo {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      display: block;
    }


    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.015em;
      line-height: 1.25;
    }

    /* The model for the next run: a plain toolbar under the title (no group
       chip or group line, so it never reads as a proposed group), with its
       actions on the right. Change opens the shared picker (ai-config.css)
       under it. It sits right above Run again and Retry, so the note it
       shows after a pick is next to the button that uses the new model. */
    .model-bar {
      border-top: 1px solid var(--bd);
      border-bottom: 1px solid var(--bd);
      padding: 10px 0;
      margin: 0 0 24px;
    }

    .model-bar[hidden] {
      display: none;
    }

    /* No model known yet (the config is loading): the bar keeps its room, so
       nothing below it jumps, but shows no placeholder name. */
    .model-bar.pending .model-bar-row {
      visibility: hidden;
    }

    .model-bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .model-label {
      flex: none;
      font-size: 13px;
      font-weight: 600;
      color: var(--tx-dim);
    }

    .model-name {
      flex: 0 1 auto;
      min-width: 0;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .default-tag {
      flex: none;
      font: 600 11.5px/1.4 var(--ui);
      color: var(--kbd-tx);
      background: var(--kbd-bg);
      border-radius: 5px;
      padding: 0 6px;
    }

    .default-tag[hidden] {
      display: none;
    }

    .model-bar-actions {
      flex: none;
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .model-note {
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--tx-dim);
    }

    .model-note:empty {
      display: none;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .model-panel {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--bd);
    }

    .model-panel[hidden] {
      display: none;
    }

    /* The inline key form, shown while organize needs a key */
    .key-setup {
      margin: 0 0 24px;
    }

    .section-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      font-size: 12px;
    }

    .section-head .group-chip {
      font-size: 12px;
      padding: 2px 8px;
    }

    .key-intro {
      margin: 0 0 12px;
    }

    .key-setup .field-error {
      margin-top: 12px;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 48px 0;
    }

    /* Focus moves here when a run starts, so a second Enter can't reach
       Stop. It is not a control, so it shows no focus ring. */
    .loading:focus,
    .loading:focus-visible {
      outline: none;
    }

    .loading-text {
      margin: 0;
      font-size: 15px;
      color: var(--tx-dim);
    }

    .spinner {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--bd-hi);
      border-top-color: var(--ac);
      animation: spin .9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation: none;
        border-top-color: var(--bd-hi);
      }
    }

    .error-msg,
    .field-error {
      padding: 12px 16px;
      background: var(--danger-soft);
      border: 1px solid var(--danger);
      border-radius: 8px;
      color: var(--danger);
      font-weight: 600;
    }

    .error-msg p {
      margin: 0;
    }

    .field-error[hidden] {
      display: none;
    }

    .compose > .error-msg,
    .compose > .ended-msg,
    #content > .error-msg,
    #content > .ended-msg {
      margin: 0 0 20px;
    }

    .apply-error {
      margin: 0 0 20px;
    }

    .apply-error[hidden] {
      display: none;
    }

    /* Shown when no run is waiting for this page (showRunEnded) */
    .ended-msg {
      padding: 12px 16px;
      background: var(--panel);
      border: 1px solid var(--bd);
      border-radius: 8px;
      color: var(--tx-dim);
    }

    .ended-msg p {
      margin: 0;
    }

    .ended-msg .ended-title {
      margin-bottom: 4px;
      color: var(--tx);
      font-weight: 600;
    }

    /* Instructions step (rendered by showInstructionsInput) */
    .mode-hint {
      margin: 0 0 20px;
      font-size: 13.5px;
      color: var(--tx-dim);
    }

    .mode-hint strong {
      color: var(--tx);
    }

    .instructions label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .instructions textarea {
      width: 100%;
      font: 14px/1.5 var(--ui);
      color: var(--tx);
      background: var(--comp);
      border: 1px solid var(--bd-control);
      border-radius: 8px;
      padding: 10px 12px;
      resize: vertical;
    }

    .instructions textarea:hover {
      border-color: var(--bd-control-hi);
    }

    .instructions textarea::placeholder,
    .next-run textarea::placeholder {
      color: var(--tx-dim);
      opacity: 1;
    }

    .proposal-head {
      margin: 0 0 10px;
      font-size: 13.5px;
      color: var(--tx-dim);
    }

    .proposal-head strong {
      color: var(--tx);
    }

    /* The instructions Run again uses, folded away under the proposal head. */
    .next-run {
      margin: 0 0 16px;
      font-size: 13.5px;
    }

    .next-run summary {
      cursor: pointer;
      color: var(--tx-dim);
      font-weight: 600;
      width: fit-content;
      border-radius: 4px;
    }

    .next-run summary .summary-text {
      font-weight: 400;
    }

    .next-run textarea {
      display: block;
      width: 100%;
      margin-top: 8px;
      font: 14px/1.5 var(--ui);
      color: var(--tx);
      background: var(--comp);
      border: 1px solid var(--bd-control);
      border-radius: 8px;
      padding: 8px 12px;
      resize: vertical;
    }

    .next-run textarea:hover {
      border-color: var(--bd-control-hi);
    }

    /* Why Apply is disabled, readable without hovering. */
    .proposal-warn {
      margin: 0 0 16px;
      padding: 10px 14px;
      background: var(--warn-soft);
      border: 1px solid var(--warn-edge);
      border-radius: 8px;
      font-size: 13.5px;
    }

    .group-empty {
      margin: 0;
      padding: 10px 16px;
      font-size: 13px;
      color: var(--tx-dim);
    }

    .keys-hint {
      margin: 12px 0 0;
      font-size: 12px;
      color: var(--tx-dim);
    }

    .keys-hint kbd {
      display: inline-block;
      min-width: 1.6em;
      margin-right: 2px;
      padding: 0 4px;
      font: 700 10.5px/1.6 var(--mono);
      text-align: center;
      border-radius: 3px;
      background: var(--kbd-bg);
      color: var(--kbd-tx);
    }

    /* A proposed group is drawn like a Chrome tab group: its name is an
       editable group chip in the group's colour, followed by the group line.
       The card's data-group sets --chip / --chip-ink (huddle-theme.css). */
    .group-card {
      background: var(--panel);
      border: 1px solid var(--bd);
      border-radius: 10px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .group-header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--bd);
    }

    /* Edges are mixed toward the chip's ink so that light yellow and orange
       chips still show a 3:1 edge on the panel. */
    .group-name {
      field-sizing: content;
      min-width: 6ch;
      max-width: 100%;
      font: 700 13.5px/1.3 var(--ui);
      padding: 3px 9px;
      border-radius: 6px;
      border: 1px solid color-mix(in srgb, var(--chip) 60%, var(--chip-ink));
      background: var(--chip);
      color: var(--chip-ink);
    }

    /* The global selection ink fails on the pastel chip fills; invert the chip. */
    .group-name::selection {
      background: var(--chip-ink);
      color: var(--chip);
    }

    .group-name:hover {
      border-color: var(--chip-ink);
    }

    .group-card .group-line {
      min-width: 24px;
    }

    .ungrouped-label {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--tx-dim);
    }

    .color-select {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .color-dot {
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid color-mix(in srgb, var(--chip) 60%, var(--chip-ink));
      background: var(--chip);
      color: var(--chip-ink);
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .color-dot svg {
      width: 12px;
      height: 12px;
      display: none;
    }

    .color-dot[aria-checked="true"] {
      box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--tx);
    }

    .color-dot[aria-checked="true"] svg {
      display: block;
    }

    .tab-count {
      font: 600 12px/1.4 var(--mono);
      color: var(--tx-dim);
      white-space: nowrap;
    }

    .tab-list {
      list-style: none;
      margin: 0;
      padding: 4px 0;
    }

    .tab-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 16px;
      transition: background .12s;
    }

    .tab-row:hover {
      background: var(--comp-hi);
    }

    .tab-favicon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border-radius: 2px;
    }

    .tab-info {
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }

    .tab-title {
      font-size: 13.5px;
      font-weight: 550;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-url {
      font: 12px/1.4 var(--mono);
      color: var(--tx-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-move {
      flex-shrink: 0;
      max-width: 180px;
      font: 13px/1.3 var(--ui);
      color: var(--tx);
      background: var(--comp);
      border: 1px solid var(--bd-control);
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
    }

    .tab-move:hover {
      border-color: var(--bd-control-hi);
    }

    /* Narrow windows and high zoom: the title keeps the row's width, and the
       Move menu takes its own line. */
    @media (max-width: 480px) {
      .tab-row {
        flex-wrap: wrap;
      }

      .tab-move {
        flex-basis: 100%;
        max-width: 100%;
      }
    }

    .actions,
    .form-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .actions {
      margin: 0 0 20px;
    }

    .actions .actions-keys {
      margin: 0 0 0 auto;
      align-self: center;
    }

    .actions[hidden] {
      display: none;
    }

    .form-actions {
      margin-top: 20px;
    }

    .btn {
      font: 600 14px/1.2 var(--ui);
      color: var(--tx);
      background: var(--comp);
      border: 1px solid var(--bd-control);
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      transition: background .12s, border-color .12s;
    }

    .btn:hover {
      background: var(--comp-hi);
      border-color: var(--bd-control-hi);
    }

    .btn.small {
      font-size: 13px;
      padding: 6px 12px;
    }

    .btn:disabled {
      opacity: .5;
      cursor: default;
    }

    .btn[hidden] {
      display: none;
    }

    .btn.primary {
      background: var(--ac);
      border-color: var(--ac);
      color: var(--on-ac);
    }

    .btn.primary:hover {
      background: var(--ac-hi);
      border-color: var(--ac-hi);
    }

    .debug-toggle {
      display: block;
      margin: 24px auto 0;
      font: 600 12.5px/1.3 var(--ui);
      color: var(--tx-dim);
      background: none;
      border: 0;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
    }

    .debug-toggle[hidden] {
      display: none;
    }

    .debug-toggle:hover {
      color: var(--tx);
      text-decoration: underline;
    }

    .debug-section {
      display: none;
      margin-top: 12px;
    }

    .debug-section.visible {
      display: block;
    }

    .debug-block {
      background: var(--panel);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .debug-block h4 {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .02em;
      color: var(--tx-dim);
    }

    .debug-block pre {
      margin: 0;
      font: 12px/1.5 var(--mono);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 300px;
      overflow-y: auto;
      scrollbar-width: thin;
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="page-head">
      <img class="logo" src="icons/huddle-mark.svg" alt="Huddle">
      <div>
        <h1>Organize with AI</h1>
      </div>
    </header>
    <section id="modelBar" class="model-bar pending" aria-label="Model">
      <div class="model-bar-row">
        <span class="model-label">Model</span>
        <span id="modelName" class="model-name"></span>
        <span id="defaultTag" class="default-tag" hidden>Default</span>
        <span class="model-bar-actions">
          <button type="button" id="makeDefault" class="link-btn" hidden>Make default</button>
          <button type="button" id="changeModel" class="link-btn" aria-expanded="false" aria-controls="modelPanel">Change</button>
        </span>
      </div>
      <p id="modelNote" class="model-note" role="status" aria-live="polite"></p>
      <div id="modelPanel" class="model-panel ai-form" hidden></div>
    </section>
    <p id="runStatus" class="visually-hidden" role="status" aria-live="polite"></p>
    <div id="actionsContainer" class="actions" hidden>
      <button type="button" class="btn primary confirm" id="applyButton" aria-keyshortcuts="Meta+Enter Control+Enter">Apply groups</button>
      <button type="button" class="btn" id="runAgainButton">Run again</button>
      <button type="button" class="btn cancel" id="cancelButton" aria-keyshortcuts="Escape">Cancel</button>
      <p class="keys-hint actions-keys" id="proposalKeys"></p>
    </div>
    <div id="content">
      <div class="loading"><p class="loading-text">Loading…</p></div>
    </div>
    <button type="button" class="debug-toggle" id="debugToggle" aria-expanded="false" aria-controls="debugSection" hidden>Show the model's raw output</button>
    <div class="debug-section" id="debugSection"></div>
  </main>
  <script src="ai-config.js"></script>
  <script src="ai-proposal.js"></script>
</body>

</html>
