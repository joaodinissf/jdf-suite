<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Huddle — Organize with AI</title>
  <link rel="stylesheet" href="huddle-theme.css">
  <link rel="stylesheet" href="ai-config.css">
  <style>
    /* Tokens, fonts, light/dark and the tab-group chips live in
       huddle-theme.css; this sheet is the proposal page's layout only. */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }

    .page-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .logo {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      display: block;
    }


    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.015em;
      line-height: 1.25;
    }

    /* The model for this run: a purple group chip heading a one-line bar;
       Change opens the shared picker (ai-config.css) under it. */
    .model-bar {
      background: var(--panel);
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 10px 16px;
      margin: 0 0 20px;
    }

    .model-bar-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 12px;
    }

    .model-bar .group-chip {
      font-size: 12px;
      padding: 2px 8px;
    }

    .model-name {
      font-weight: 600;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .default-tag {
      font: 600 12px/1.4 var(--mono);
      color: var(--tx-dim);
    }

    .default-tag[hidden] {
      display: none;
    }

    .model-bar .group-line {
      min-width: 24px;
    }

    .model-note {
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--tx-dim);
    }

    .model-note:empty {
      display: none;
    }

    .model-panel {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--bd);
    }

    .model-panel[hidden] {
      display: none;
    }

    /* The inline key form, shown while organize needs a key */
    .key-setup {
      margin: 0 0 24px;
    }

    .section-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      font-size: 12px;
    }

    .section-head .group-chip {
      font-size: 12px;
      padding: 2px 8px;
    }

    .key-intro {
      margin: 0 0 12px;
    }

    .key-setup .error-msg {
      margin-top: 12px;
    }

    .loading {
      text-align: center;
      padding: 60px 0;
      font-size: 15px;
      color: var(--tx-dim);
    }

    .error-msg {
      padding: 12px 16px;
      background: var(--danger-soft);
      border: 1px solid var(--danger);
      border-radius: 8px;
      color: var(--danger);
      font-weight: 600;
    }

    .apply-error {
      margin: 0 0 20px;
    }

    .apply-error[hidden] {
      display: none;
    }

    /* Shown when no run is waiting for this page (showRunEnded) */
    .ended-msg {
      padding: 12px 16px;
      background: var(--panel);
      border: 1px solid var(--bd);
      border-radius: 8px;
      color: var(--tx-dim);
    }

    .ended-msg p {
      margin: 0;
    }

    .ended-msg .ended-title {
      margin-bottom: 4px;
      color: var(--tx);
      font-weight: 600;
    }

    /* Instructions step (rendered by showInstructionsInput) */
    .mode-hint {
      margin: 0 0 20px;
      font-size: 13.5px;
      color: var(--tx-dim);
    }

    .mode-hint strong {
      color: var(--tx);
    }

    .instructions label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .instructions textarea {
      width: 100%;
      font: 14px/1.5 var(--ui);
      color: var(--tx);
      background: var(--comp);
      border: 1px solid var(--bd-control);
      border-radius: 8px;
      padding: 10px 12px;
      resize: vertical;
    }

    .instructions textarea:hover {
      border-color: var(--bd-control-hi);
    }

    .instructions textarea::placeholder {
      color: var(--tx-dim);
      opacity: 1;
    }

    /* A proposed group is drawn like a Chrome tab group: its name is an
       editable group chip in the group's colour, followed by the group line.
       The card's data-group sets --chip / --chip-ink (huddle-theme.css). */
    .group-card {
      background: var(--panel);
      border: 1px solid var(--bd);
      border-radius: 10px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .group-header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--bd);
    }

    /* Edges are mixed toward the chip's ink so that light yellow and orange
       chips still show a 3:1 edge on the panel. */
    .group-name {
      field-sizing: content;
      min-width: 6ch;
      max-width: 100%;
      font: 700 13.5px/1.3 var(--ui);
      padding: 3px 9px;
      border-radius: 6px;
      border: 1px solid color-mix(in srgb, var(--chip) 60%, var(--chip-ink));
      background: var(--chip);
      color: var(--chip-ink);
    }

    /* The global selection ink fails on the pastel chip fills; invert the chip. */
    .group-name::selection {
      background: var(--chip-ink);
      color: var(--chip);
    }

    .group-name:hover {
      border-color: var(--chip-ink);
    }

    .group-card .group-line {
      min-width: 24px;
    }

    .ungrouped-label {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--tx-dim);
    }

    .color-select {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .color-dot {
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid color-mix(in srgb, var(--chip) 60%, var(--chip-ink));
      background: var(--chip);
      color: var(--chip-ink);
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .color-dot svg {
      width: 12px;
      height: 12px;
      display: none;
    }

    .color-dot[aria-pressed="true"] {
      box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--tx);
    }

    .color-dot[aria-pressed="true"] svg {
      display: block;
    }

    .tab-count {
      font: 600 12px/1.4 var(--mono);
      color: var(--tx-dim);
      white-space: nowrap;
    }

    .tab-list {
      padding: 4px 0;
    }

    .tab-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 16px;
      transition: background .12s;
    }

    .tab-row:hover {
      background: var(--comp-hi);
    }

    .tab-favicon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border-radius: 2px;
    }

    .tab-info {
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }

    .tab-title {
      font-size: 13.5px;
      font-weight: 550;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-url {
      font: 12px/1.4 var(--mono);
      color: var(--tx-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-move {
      flex-shrink: 0;
      max-width: 180px;
      font: 13px/1.3 var(--ui);
      color: var(--tx);
      background: var(--comp);
      border: 1px solid var(--bd-control);
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
    }

    .tab-move:hover {
      border-color: var(--bd-control-hi);
    }

    .actions,
    .form-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .actions {
      margin: 0 0 20px;
    }

    .form-actions {
      margin-top: 20px;
    }

    .btn {
      font: 600 14px/1.2 var(--ui);
      color: var(--tx);
      background: var(--comp);
      border: 1px solid var(--bd-control);
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      transition: background .12s, border-color .12s;
    }

    .btn:hover {
      background: var(--comp-hi);
      border-color: var(--bd-control-hi);
    }

    .btn.small {
      font-size: 13px;
      padding: 6px 12px;
    }

    .btn:disabled {
      opacity: .5;
      cursor: default;
    }

    .btn[hidden] {
      display: none;
    }

    .btn.primary {
      background: var(--ac);
      border-color: var(--ac);
      color: var(--on-ac);
    }

    .btn.primary:hover {
      background: var(--ac-hi);
      border-color: var(--ac-hi);
    }

    .debug-toggle {
      display: block;
      margin: 24px auto 0;
      font: 600 12.5px/1.3 var(--ui);
      color: var(--tx-dim);
      background: none;
      border: 0;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
    }

    .debug-toggle[hidden] {
      display: none;
    }

    .debug-toggle:hover {
      color: var(--tx);
      text-decoration: underline;
    }

    .debug-section {
      display: none;
      margin-top: 12px;
    }

    .debug-section.visible {
      display: block;
    }

    .debug-block {
      background: var(--panel);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .debug-block h4 {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .02em;
      color: var(--tx-dim);
    }

    .debug-block pre {
      margin: 0;
      font: 12px/1.5 var(--mono);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 300px;
      overflow-y: auto;
      scrollbar-width: thin;
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="page-head">
      <img class="logo" src="icons/huddle-mark.svg" alt="Huddle">
      <div>
        <h1>Organize with AI</h1>
      </div>
    </header>
    <section id="modelBar" class="model-bar" data-group="purple" aria-label="Model for this run">
      <div class="model-bar-row">
        <span class="group-chip">Model</span>
        <span id="modelName" class="model-name">Default model</span>
        <span id="defaultTag" class="default-tag" hidden>default</span>
        <button type="button" id="makeDefault" class="link-btn" hidden>Make default</button>
        <button type="button" id="changeModel" class="link-btn" aria-expanded="false" aria-controls="modelPanel">Change</button>
        <span class="group-line"></span>
        <button type="button" id="runAgainButton" class="btn small" hidden>Run again</button>
      </div>
      <p id="modelNote" class="model-note" role="status" aria-live="polite"></p>
      <div id="modelPanel" class="model-panel ai-form" hidden></div>
    </section>
    <div id="actionsContainer" class="actions" style="display: none;">
      <button class="btn primary confirm" id="applyButton">Apply groups</button>
      <button class="btn cancel" id="cancelButton">Cancel</button>
    </div>
    <div id="content">
      <div class="loading">Loading proposal…</div>
    </div>
    <button class="debug-toggle" id="debugToggle" hidden>Show the model's raw output</button>
    <div class="debug-section" id="debugSection"></div>
  </main>
  <script src="ai-config.js"></script>
  <script src="ai-proposal.js"></script>
</body>

</html>
