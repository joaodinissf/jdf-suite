<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Huddle — Settings</title>
  <link rel="stylesheet" href="huddle-theme.css">
  <style>
    /* Tokens, fonts, light/dark and the tab-group chips live in
       huddle-theme.css; this sheet is the settings page's layout only. */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
    }

    .page {
      max-width: 640px;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }

    .page-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .logo {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      display: block;
    }


    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.015em;
      line-height: 1.25;
    }

    .subtitle {
      margin: 0 0 32px;
      font-size: 13.5px;
      color: var(--tx-dim);
    }

    code {
      font-family: var(--mono);
      font-size: .92em;
      padding: 0 4px;
      border-radius: 4px;
      background: var(--kbd-bg);
      color: var(--kbd-tx);
    }

    /* Sections are tab groups: a Chrome-style group chip and its group line
       (see huddle-theme.css). */
    .section-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      font-size: 12px;
    }

    .section-head .group-chip {
      font-size: 12px;
      padding: 2px 8px;
    }

    .hint {
      margin: 0 0 14px;
      font-size: 13.5px;
      color: var(--tx-dim);
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 0 18px;
    }

    .field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--bd);
    }

    .field:last-child {
      border-bottom: 0;
    }

    .field label {
      flex: 1;
      font-size: 14px;
      font-weight: 550;
    }

    .field select {
      font: 14px/1.3 var(--ui);
      color: var(--tx);
      background: var(--comp);
      border: 1px solid var(--bd-control);
      border-radius: 7px;
      padding: 6px 10px;
      min-width: 120px;
      cursor: pointer;
    }

    .field select:hover {
      border-color: var(--bd-control-hi);
    }

    .field input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--ac);
      cursor: pointer;
    }

    .status {
      min-height: 20px;
      margin-top: 10px;
      font-size: 13px;
      color: var(--tx-dim);
      opacity: 0;
      transition: opacity .3s ease;
    }

    .status.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-head">
      <img class="logo" src="icons/huddle-mark.svg" alt="Huddle">
      <div>
        <h1>Settings</h1>
      </div>
    </header>
    <p class="subtitle">These settings follow your Chrome profile to every computer you sign in on.</p>

    <section>
      <h2 class="section-head" data-group="cyan"><span class="group-chip">Link clumping</span><span class="group-line"></span></h2>
      <p class="hint">Hold the activation key, then click-drag a rectangle over a page's links. On release, every link inside the rectangle opens as a new background tab next to the current one.</p>

      <div class="card">
        <div class="field">
          <label for="clumping-enabled">Enable link clumping</label>
          <input type="checkbox" id="clumping-enabled">
        </div>

        <div class="field">
          <label for="clumping-key">Activation key</label>
          <select id="clumping-key"></select>
        </div>

        <div class="field">
          <label for="clumping-modifier">Modifier</label>
          <select id="clumping-modifier">
            <option value="">None</option>
            <option value="shift">Shift</option>
            <option value="ctrl">Ctrl</option>
            <option value="alt">Alt</option>
          </select>
        </div>
      </div>

      <div id="clumping-status" class="status" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script src="options.js"></script>
</body>
</html>
