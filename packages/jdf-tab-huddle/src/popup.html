<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Huddle</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a0c;
      --panel: #111114;
      --comp: #17171b;
      --comp-hi: #202026;
      --bd: #26262c;
      --bd-hi: #3a3a42;
      --tx: #f3f4f6;
      --tx-dim: #8b8d97;
      --ac: #3aa0ff;
      --ac-hi: #59b1ff;
      --ac-line: rgba(255, 255, 255, .16);
      --ac-soft: rgba(58, 160, 255, .15);
      --ac-txt: #7cc0ff;
      --sleep: #e0b64b;
      --sleep-soft: rgba(224, 182, 75, .15);
      --ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
      --mono: ui-monospace, 'Cascadia Code', 'Segoe UI Mono', 'SFMono-Regular', Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: auto;
      overflow: visible;
    }

    body {
      width: 380px;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--tx);
      font-family: var(--ui);
      -webkit-font-smoothing: antialiased;
      line-height: 1.4;
    }

    .p-pad {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* header */
    .p-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: var(--ac);
      display: grid;
      place-items: center;
      color: #fff;
      box-shadow: 0 0 0 1px var(--ac-line) inset;
      font-size: 12px;
      flex: 0 0 auto;
    }

    .brand h2 {
      margin: 0;
      font-size: 14.5px;
      font-weight: 650;
      letter-spacing: -.01em;
      color: var(--tx);
    }

    .brand small {
      display: block;
      font-size: 9.5px;
      color: var(--tx-dim);
      letter-spacing: .04em;
      margin-top: -1px;
    }

    .seg {
      display: inline-flex;
      background: var(--comp);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 2px;
      flex: 0 0 auto;
    }

    .seg button {
      font-family: var(--ui);
      border: 0;
      background: transparent;
      color: var(--tx-dim);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .02em;
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .seg button[aria-pressed="true"] {
      background: var(--ac);
      color: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .35);
    }

    /* groups */
    .eyebrow {
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: .14em;
      font-weight: 600;
      color: var(--tx-dim);
      margin: 0 0 6px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .eyebrow .rule {
      flex: 1;
      height: 1px;
      background: var(--bd);
      opacity: .6;
    }

    .eyebrow .count-pill {
      font: 600 9.5px var(--mono);
      padding: 1px 6px;
      border-radius: 99px;
      background: var(--sleep-soft);
      color: var(--sleep);
    }

    .grp {
      display: flex;
      flex-direction: column;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .grid3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }

    button {
      font-family: var(--ui);
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      font-family: var(--ui);
      font-size: 11.5px;
      font-weight: 550;
      color: var(--tx);
      background: var(--comp);
      border: 1px solid var(--bd);
      border-radius: 7px;
      padding: 7px 8px;
      cursor: pointer;
      transition: background .12s, border-color .12s, transform .06s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn:hover {
      background: var(--comp-hi);
      border-color: var(--bd-hi);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.wide {
      width: 100%;
    }

    .btn.primary {
      background: var(--ac);
      border-color: var(--ac);
      color: #fff;
      font-weight: 600;
      justify-content: center;
    }

    .btn.primary:hover {
      background: var(--ac-hi);
      border-color: var(--ac-hi);
    }

    .btn.mini {
      padding: 6px 6px;
      font-size: 10.5px;
    }

    .btn:disabled,
    .chip:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .btn:disabled:hover {
      background: var(--comp);
      border-color: var(--bd);
      transform: none;
    }

    .icon {
      width: 13px;
      height: 13px;
      flex: 0 0 auto;
    }

    .ai-cog-btn {
      flex: 0 0 32px;
      justify-content: center;
    }

    /* snooze */
    .snooze-targets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px 4px 5px;
      background: var(--comp);
      border: 1px solid var(--bd);
      border-radius: 7px;
      cursor: pointer;
      color: var(--tx);
      font-family: var(--ui);
      font-size: 10.5px;
      font-weight: 550;
      transition: background .12s, border-color .12s;
    }

    .chip:hover {
      background: var(--comp-hi);
      border-color: var(--bd-hi);
    }

    .chip.selected {
      border-color: var(--ac);
      background: var(--ac-soft);
      color: var(--ac-txt);
    }

    #snoozePickerPanel {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed var(--bd);
    }

    .presets-row {
      display: flex;
      gap: 4px;
    }

    .preset {
      flex: 1;
      font-family: var(--ui);
      font-size: 10.5px;
      font-weight: 600;
      color: var(--tx-dim);
      background: transparent;
      border: 1px solid var(--bd);
      border-radius: 6px;
      padding: 6px 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    .preset:hover {
      color: var(--ac-txt);
      border-color: var(--ac);
      background: var(--ac-soft);
    }

    .custom-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    #snoozeCustomTime {
      flex: 1;
      background: var(--comp);
      color: var(--tx);
      border: 1px solid var(--bd);
      border-radius: 7px;
      padding: 6px 8px;
      font-size: 11px;
      font-family: inherit;
      min-width: 0;
    }

    #snoozeCustomTime::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }

    #snoozeCustomConfirm,
    #snoozePickerCancel {
      flex: 0 0 auto;
      padding: 6px 9px;
      font-size: 10.5px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid var(--bd);
      background: var(--comp);
      color: var(--tx);
      cursor: pointer;
      white-space: nowrap;
    }

    #snoozeCustomConfirm {
      border-color: var(--ac);
      color: var(--ac-txt);
      background: var(--ac-soft);
    }

    .copy-feedback,
    #snoozeFeedback {
      font-size: 10.5px;
      color: var(--ac-txt);
      text-align: center;
      opacity: 0;
      transition: opacity .2s ease;
      height: 14px;
    }

    .copy-feedback.visible,
    #snoozeFeedback.visible {
      opacity: 1;
    }

    /* sleeping preview */
    .expand-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: auto;
      font-family: var(--ui);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .04em;
      color: var(--ac-txt);
      background: transparent;
      border: 1px solid var(--bd);
      border-radius: 6px;
      padding: 3px 7px;
      cursor: pointer;
      transition: border-color .12s, background .12s;
    }

    .expand-link:hover {
      border-color: var(--ac);
      background: var(--ac-soft);
    }

    .sleep-wrap {
      border: 1px solid var(--bd);
      border-radius: 9px;
      background: var(--panel);
      overflow: hidden;
    }

    #snoozedList {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 100px;
      overflow-y: auto;
    }

    #snoozedList::-webkit-scrollbar {
      width: 8px;
    }

    #snoozedList::-webkit-scrollbar-thumb {
      background: var(--bd-hi);
      border-radius: 99px;
      border: 2px solid var(--panel);
    }

    .snoozed-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-bottom: 1px solid var(--bd);
    }

    .snoozed-item:last-child {
      border-bottom: 0;
    }

    .snoozed-summary {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 11.5px;
      font-weight: 550;
    }

    .snoozed-time {
      flex: 0 0 auto;
      font-size: 10px;
      color: var(--tx-dim);
      font-family: var(--mono);
      white-space: nowrap;
    }

    .snoozed-item button {
      flex: 0 0 auto;
      font-size: 10px;
      font-weight: 600;
      color: var(--tx-dim);
      background: transparent;
      border: 1px solid var(--bd);
      border-radius: 6px;
      padding: 4px 7px;
      cursor: pointer;
    }

    .snoozed-wake:hover {
      color: var(--ac-txt);
      border-color: var(--ac);
    }

    .snoozed-cancel:hover {
      color: #ff8585;
      border-color: #ff858555;
    }

    /* footer */
    .foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 9px;
      border-top: 1px solid var(--bd);
    }

    .stat {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--tx-dim);
      line-height: 1.5;
    }

    .stat b {
      color: var(--tx);
      font-weight: 600;
    }

    .gear {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--tx-dim);
      font-size: 10.5px;
      cursor: pointer;
      text-decoration: none;
    }

    .gear:hover {
      color: var(--tx);
    }
  </style>
</head>

<body>
  <div class="p-pad">

    <div class="p-head">
      <div class="brand">
        <span class="logo">H</span>
        <div>
          <h2>Huddle</h2>
          <small id="modeSubtitle">respecting groups</small>
        </div>
      </div>
      <div class="seg" role="group" aria-label="Respect groups">
        <button id="modeGroups" data-action="setRespectGroups" data-value="true" aria-pressed="true">Groups</button>
        <button id="modeFlat" data-action="setRespectGroups" data-value="false" aria-pressed="false">Flat</button>
      </div>
    </div>

    <div class="grp">
      <div class="eyebrow">This window<span class="rule"></span></div>
      <div class="grid3" style="margin-bottom: 6px">
        <button id="sortCurrentWindow" class="btn" data-action="sortCurrentWindow"
          title="Sort tabs alphabetically by URL">Sort</button>
        <button id="removeDuplicatesWindow" class="btn" data-action="removeDuplicatesWindow"
          title="Remove duplicate tabs in this window">Deduplicate</button>
        <button id="flattenWindow" class="btn" data-action="flattenWindow"
          title="Ungroup all tabs in this window">Ungroup</button>
      </div>
      <div class="grid2">
        <button id="aiOrganize" class="btn primary wide" data-action="aiGroupTabs"
          title="Use AI to organize tabs into groups" style="grid-column: 1 / -1">Organize with AI</button>
        <button id="aiSettings" class="btn ai-cog-btn" data-action="openAiSettings" style="display: none"
          title="AI settings">&#9881;</button>
      </div>
    </div>

    <div class="grp multi-window-section">
      <div class="eyebrow">All windows<span class="rule"></span></div>
      <div class="grid2">
        <button id="sortAllWindows" class="btn" data-action="sortAllWindows"
          title="Sort tabs in every window alphabetically by URL">Sort all windows</button>
        <button id="moveAllToSingleWindow" class="btn" data-action="moveAllToSingleWindow"
          title="Move all tabs from every window into the current window">Merge windows</button>
        <button id="removeDuplicatesAllWindows" class="btn" data-action="removeDuplicatesAllWindows"
          title="Remove duplicates within each window separately">Deduplicate per window</button>
        <button id="removeDuplicatesGlobally" class="btn" data-action="removeDuplicatesGlobally"
          title="Remove duplicates across all windows">Deduplicate globally</button>
      </div>
    </div>

    <div class="grp">
      <div class="eyebrow">Extract &amp; copy<span class="rule"></span></div>
      <div class="grid3">
        <button id="extractDomain" class="btn mini" data-action="extractDomain"
          title="Move all tabs of the current domain into a new window">Extract domain</button>
        <button id="extractAllDomains" class="btn mini" data-action="extractAllDomains"
          title="Split tabs into one window per domain">Split domains</button>
        <button id="copyAllTabs" class="btn mini" data-action="copyAllTabs"
          title="Copy all tab URLs to the clipboard">Copy all tabs</button>
      </div>
      <div id="copyFeedback" class="copy-feedback">Copied!</div>
    </div>

    <div class="grp" id="snoozeSection">
      <div class="eyebrow">Snooze<span class="rule"></span></div>
      <div class="snooze-targets">
        <button id="snoozeTab" class="chip" data-action="openSnoozePicker" data-unit="tab"
          title="Snooze the active tab">Tab</button>
        <button id="snoozeSelected" class="chip" data-action="openSnoozePicker" data-unit="selected"
          title="Snooze all highlighted tabs">Selected</button>
        <button id="snoozeWindow" class="chip" data-action="openSnoozePicker" data-unit="window"
          title="Snooze every tab in this window">Window</button>
        <button id="snoozeGroup" class="chip" data-action="openSnoozePicker" data-unit="group"
          title="Snooze the active tab's group">Group</button>
      </div>
      <div id="snoozePickerPanel" hidden>
        <div class="presets-row">
          <button id="snoozePreset-laterToday" class="preset"></button>
          <button id="snoozePreset-tonight" class="preset"></button>
        </div>
        <div class="presets-row">
          <button id="snoozePreset-tomorrow" class="preset"></button>
          <button id="snoozePreset-weekend" class="preset"></button>
          <button id="snoozePreset-nextWeek" class="preset"></button>
        </div>
        <div class="custom-row">
          <input type="datetime-local" id="snoozeCustomTime">
          <button id="snoozeCustomConfirm">Snooze</button>
          <button id="snoozePickerCancel">Cancel</button>
        </div>
        <div id="snoozeFeedback"></div>
      </div>
    </div>

    <div class="grp" id="sleepingSection" hidden>
      <div class="eyebrow">Sleeping <span id="sleepingCount" class="count-pill">0</span><span class="rule"></span>
        <button id="expandSleeping" class="expand-link" data-action="openNapRoom"
          title="Open the full sleeping list in its own tab">Expand&#8599;</button>
      </div>
      <div class="sleep-wrap">
        <ul id="snoozedList"></ul>
      </div>
    </div>

    <div class="foot">
      <div class="stat">
        <div><b id="statusThisWindow"></b></div>
        <div class="multi-window-section"><span id="statusAllWindows"></span></div>
      </div>
      <a href="#" id="openOptions" class="gear">&#9881; Settings</a>
    </div>

  </div>

  <script src="popup.js"></script>
</body>

</html>
