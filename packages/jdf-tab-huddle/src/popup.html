<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Huddle</title>
  <link rel="stylesheet" href="huddle-theme.css">
  <style>
    /* Tokens, fonts, light/dark and the tab-group chips live in
       huddle-theme.css; this sheet is the popup's layout only. */
    * {
      box-sizing: border-box;
    }

    /* The [hidden] attribute must always win over author display rules
       (e.g. .grp / #snoozePickerPanel set display:flex, which otherwise
       defeats the UA [hidden]{display:none} and leaves collapsed panels
       such as the snooze picker and the empty sleeping section visible). */
    [hidden] {
      display: none !important;
    }

    html, body {
      height: auto;
      overflow: visible;
    }

    body {
      width: 380px;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--tx);
      font-family: var(--ui);
      -webkit-font-smoothing: antialiased;
      line-height: 1.4;
    }

    .p-pad {
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* header */
    .p-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo {
      width: 24px;
      height: 24px;
      flex: 0 0 auto;
      display: block;
    }

    .brand h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -.01em;
      color: var(--tx);
    }

    .brand small {
      display: block;
      font-size: 9.5px;
      color: var(--tx-dim);
      letter-spacing: .04em;
      margin-top: -1px;
    }

    .seg {
      display: inline-flex;
      background: var(--comp);
      border: 1px solid var(--bd-control);
      border-radius: 8px;
      padding: 2px;
      flex: 0 0 auto;
    }

    .seg button {
      font-family: var(--ui);
      border: 0;
      background: transparent;
      color: var(--tx-dim);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .02em;
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .seg button[aria-pressed="true"] {
      background: var(--ac);
      color: var(--on-ac);
      box-shadow: 0 1px 2px rgba(0, 0, 0, .35);
    }

    /* Sections are tab groups: a Chrome-style group chip and its group line
       (see huddle-theme.css). */
    .section-head {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 4px;
      font-size: 11px;
    }

    h3.group-chip {
      margin: 0;
    }

    /* Drawn icons (settings, open the nap room), in the text colour. */
    .ico {
      width: 12px;
      height: 12px;
      flex: 0 0 auto;
    }

    .group-chip .count-pill {
      font: 700 10px/1.4 var(--mono);
      padding: 0 5px;
      border-radius: 99px;
      background: rgba(0, 0, 0, .14);
      color: inherit;
    }

    .grp {
      display: flex;
      flex-direction: column;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    button {
      font-family: var(--ui);
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      font-family: var(--ui);
      font-size: 11.5px;
      font-weight: 550;
      color: var(--tx);
      background: var(--comp);
      border: 1px solid var(--bd-control);
      border-radius: 7px;
      padding: 6px 8px;
      cursor: pointer;
      transition: background .12s, border-color .12s, transform .06s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* :where keeps these at .btn:hover weight, so .btn.primary keeps its accent border. */
    .btn:hover:where(:not(:disabled)) {
      background: var(--comp-hi);
      border-color: var(--bd-control-hi);
    }

    .btn:active:where(:not(:disabled)) {
      transform: translateY(1px);
    }

    /* The AI action is a guest, not the hero: a soft blue action. */
    .btn.primary {
      background: var(--ac-soft);
      border-color: var(--ac);
      color: var(--ac-txt);
      font-weight: 700;
      justify-content: center;
    }

    .btn.primary:hover {
      background: var(--comp-hi);
    }

    .btn.mini {
      padding: 6px 6px;
      font-size: 10.5px;
    }

    .btn:disabled,
    .chip:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .icon {
      width: 13px;
      height: 13px;
      flex: 0 0 auto;
    }

    /* keyboard hotkey hint badges */
    .hotkey-hint {
      display: inline-block;
      margin-left: 4px;
      padding: 0 3px;
      font: 700 8.5px var(--mono);
      line-height: 1.5;
      border-radius: 3px;
      background: var(--kbd-bg);
      color: var(--kbd-tx);
      vertical-align: middle;
      pointer-events: none;
    }

    .seg button .hotkey-hint {
      margin-left: 3px;
    }

    /* Badges on the accent fill follow the fill's ink. */
    .seg button[aria-pressed="true"] .hotkey-hint {
      background: rgba(0, 0, 0, .16);
      color: var(--on-ac);
    }

    .chip .hotkey-hint,
    .preset .hotkey-hint {
      margin-left: 3px;
    }

    .snoozed-item button .hotkey-hint {
      margin-left: 2px;
      padding: 0 2px;
    }

    /* snooze */
    .snooze-targets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .chip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px 4px;
      background: var(--comp);
      border: 1px solid var(--bd-control);
      border-radius: 7px;
      cursor: pointer;
      color: var(--tx);
      font-family: var(--ui);
      font-size: 10.5px;
      font-weight: 550;
      transition: background .12s, border-color .12s;
    }

    /* :where keeps this below .chip.selected, so a selected chip keeps its look. */
    .chip:hover:where(:not(:disabled)) {
      background: var(--comp-hi);
      border-color: var(--bd-control-hi);
    }

    .chip.selected {
      border-color: var(--ac);
      background: var(--ac-soft);
      color: var(--ac-txt);
    }

    body.picking .grp:not(#snoozeSection),
    body.picking .foot {
      display: none !important;
    }

    #snoozePickerPanel {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed var(--bd);
    }

    .presets {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }

    /* Five presets on two columns: the last one spans the row instead of
       sitting alone. */
    #snoozePreset-nextWeek {
      grid-column: 1 / -1;
    }

    .preset {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: var(--ui);
      font-size: 10.5px;
      font-weight: 600;
      color: var(--tx);
      background: transparent;
      border: 1px solid var(--bd-control);
      border-radius: 6px;
      padding: 6px 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    .preset:hover:not(:disabled) {
      color: var(--ac-txt);
      border-color: var(--ac);
      background: var(--ac-soft);
    }

    /* Until the preset times arrive from the background. */
    .preset:disabled {
      color: var(--tx-dim);
      cursor: default;
    }

    .custom-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    #snoozeCustomTime {
      flex: 1;
      background: var(--comp);
      color: var(--tx);
      border: 1px solid var(--bd-control);
      border-radius: 7px;
      padding: 6px 8px;
      font-size: 11px;
      font-family: inherit;
      min-width: 0;
    }

    #snoozeCustomTime::-webkit-calendar-picker-indicator {
      cursor: pointer;
    }

    #snoozeCustomConfirm,
    #snoozePickerCancel {
      flex: 0 0 auto;
      padding: 6px 9px;
      font-size: 10.5px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid var(--bd-control);
      background: var(--comp);
      color: var(--tx);
      cursor: pointer;
      white-space: nowrap;
    }

    #snoozeCustomConfirm {
      border-color: var(--ac);
      color: var(--ac-txt);
      background: var(--ac-soft);
    }

    /* Only ever carries errors (a snooze that worked closes the picker and
       reports in #actionResult), so it reads as one. */
    #snoozeFeedback {
      font-size: 10.5px;
      color: var(--danger);
      text-align: center;
      opacity: 0;
      transition: opacity .2s ease;
      height: 14px;
    }

    #snoozeFeedback.visible {
      opacity: 1;
    }

    .copy-feedback {
      display: none;
      font-size: 11px;
      color: var(--ac-txt);
    }

    .copy-feedback.visible {
      display: block;
    }

    /* sleeping preview */
    .expand-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: auto;
      font-family: var(--ui);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .04em;
      color: var(--ac-txt);
      background: transparent;
      border: 1px solid var(--bd-control);
      border-radius: 6px;
      padding: 3px 7px;
      cursor: pointer;
      transition: border-color .12s, background .12s;
    }

    .expand-link:hover {
      border-color: var(--ac);
      background: var(--ac-soft);
    }

    .sleep-wrap {
      border: 1px solid var(--bd);
      border-radius: 9px;
      background: var(--panel);
      overflow: hidden;
    }

    #snoozedList {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 100px;
      overflow-y: auto;
    }

    #snoozedList::-webkit-scrollbar {
      width: 8px;
    }

    #snoozedList::-webkit-scrollbar-thumb {
      background: var(--bd-hi);
      border-radius: 99px;
      border: 2px solid var(--panel);
    }

    .snoozed-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-bottom: 1px solid var(--bd);
    }

    .snoozed-item:last-child {
      border-bottom: 0;
    }

    .snoozed-summary {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 11.5px;
      font-weight: 550;
    }

    .snoozed-time {
      flex: 0 0 auto;
      font-size: 10px;
      color: var(--tx-dim);
      font-family: var(--mono);
      white-space: nowrap;
    }

    .snoozed-item button {
      flex: 0 0 auto;
      font-size: 10px;
      font-weight: 600;
      color: var(--tx-dim);
      background: transparent;
      border: 1px solid var(--bd-control);
      border-radius: 6px;
      padding: 4px 7px;
      cursor: pointer;
    }

    .snoozed-wake:hover {
      color: var(--ac-txt);
      border-color: var(--ac);
    }

    /* Discard drops the tabs for good, so it is set apart from Wake now and
       only turns red when you reach for it. */
    .snoozed-item button.snoozed-discard {
      border-color: transparent;
    }

    .snoozed-item button.snoozed-discard:hover,
    .snoozed-item button.snoozed-discard:focus-visible {
      color: var(--danger);
      border-color: var(--danger);
    }

    .undo-notice {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border: 1px solid var(--bd);
      border-radius: 9px;
      background: var(--panel);
      font-size: 11px;
      color: var(--tx);
    }

    .undo-notice span {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .undo-notice button {
      flex: 0 0 auto;
      font-family: var(--ui);
      font-size: 10.5px;
      font-weight: 600;
      color: var(--ac-txt);
      background: var(--ac-soft);
      border: 1px solid var(--ac);
      border-radius: 6px;
      padding: 4px 9px;
      cursor: pointer;
    }

    .toasts {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
      pointer-events: none;
    }

    /* Toasts float: a raised surface, inset from the popup's edges, so they
       never read as another list row. */
    .toasts > * {
      pointer-events: auto;
      background: var(--comp-hi);
      border: 1px solid var(--bd-hi);
      border-radius: 10px;
      padding: 8px 11px;
      box-shadow: var(--shadow-float);
    }

    /* What the last action did, announced politely. Long messages (errors
       carry what to do next) wrap rather than lose their end to an ellipsis. */
    .action-result {
      font-size: 11px;
      color: var(--ac-txt);
      border-radius: 7px;
      padding: 6px 10px;
      overflow-wrap: anywhere;
    }

    /* Keep the raised surface: a see-through error would be drawn straight
       over the controls underneath. */
    .action-result.error {
      color: var(--danger);
      background: color-mix(in srgb, var(--danger) 8%, var(--comp-hi));
      border: 1px solid var(--danger);
    }

    /* While a toast shows, reserve its height (measured by the popup script)
       at the bottom of the page, so it never sits on the footer's controls. */
    body.has-toast {
      padding-bottom: calc(var(--toast-space, 34px) + 10px);
    }

    /* footer */
    .foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 9px;
      border-top: 1px solid var(--bd);
    }

    .stat {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--tx-dim);
      line-height: 1.5;
    }

    .stat b {
      color: var(--tx);
      font-weight: 600;
    }

    .gear {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--tx-dim);
      font: inherit;
      font-size: 10.5px;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }

    .foot-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }

    .open-shortcut {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--tx-dim);
    }

    .gear:hover {
      color: var(--tx);
    }
  </style>
</head>

<body>
  <div class="p-pad">

    <div class="p-head">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect width="32" height="32" rx="8" fill="#1a73e8"/>
          <path d="M5 21V14q0-2 2-2h2q2 0 2 2v7Z" fill="#fff"/>
          <path d="M13 21V11q0-2 2-2h2q2 0 2 2v10Z" fill="#fff"/>
          <path d="M21 21V14q0-2 2-2h2q2 0 2 2v7Z" fill="#fff"/>
          <rect x="5" y="23.5" width="22" height="3" rx="1.5" fill="#fdd663"/>
        </svg>
        <div>
          <h2>Huddle</h2>
          <small id="modeSubtitle">respecting groups</small>
        </div>
      </div>
      <div class="seg" role="group" aria-label="Respect groups">
        <button id="modeGroups" data-action="setRespectGroups" data-value="true" aria-pressed="true">Groups</button>
        <button id="modeFlat" data-action="setRespectGroups" data-value="false" aria-pressed="false">Flat</button>
      </div>
    </div>


    <div class="grp">
      <h3 class="section-head" data-group="blue"><span class="group-chip">This window</span><span class="group-line"></span></h3>
      <div class="grid2">
        <button id="sortCurrentWindow" class="btn" data-action="sortCurrentWindow"
          title="Sort tabs alphabetically by URL">Sort</button>
        <button id="removeDuplicatesWindow" class="btn" data-action="removeDuplicatesWindow"
          title="Remove duplicate tabs in this window">Deduplicate</button>
        <button id="flattenWindow" class="btn" data-action="flattenWindow"
          title="Ungroup all tabs in this window">Ungroup</button>
        <button id="aiOrganize" class="btn primary" data-action="aiGroupTabs"
          title="Use AI to organize tabs into groups">Organize with AI</button>
      </div>
      <!-- Shown only where Chrome can create Split Views (Chrome 155+). -->
      <div id="splitViewRow" class="grid2" style="margin-top: 6px" hidden>
        <button id="compactWindow" class="btn" data-action="compactWindow"
          title="Pair adjacent tabs into Split Views">Compact</button>
        <button id="expandWindow" class="btn" data-action="expandWindow"
          title="Separate every Split View in this window">Expand</button>
      </div>
    </div>

    <div class="grp">
      <h3 class="section-head" data-group="green"><span class="group-chip">Extract &amp; copy</span><span class="group-line"></span></h3>
      <div class="grid2">
        <button id="extractDomain" class="btn mini" data-action="extractDomain"
          title="Move all tabs of the current domain into a new window">Extract domain</button>
        <button id="extractAllDomains" class="btn mini" data-action="extractAllDomains"
          title="Split tabs into one window per domain">Split domains</button>
        <button id="copyThisWindow" class="btn mini" data-action="copyThisWindow"
          title="Copy all tab URLs in this window to the clipboard">Copy this window</button>
        <button id="copyAllWindows" class="btn mini" data-action="copyAllWindows"
          title="Copy all tab URLs across every window to the clipboard">Copy all windows</button>
      </div>
    </div>

    <div class="grp" id="snoozeSection">
      <h3 class="section-head" data-group="yellow"><span class="group-chip">Snooze</span><span class="group-line"></span></h3>
      <div class="snooze-targets">
        <button id="snoozeTab" class="chip" aria-expanded="false" aria-controls="snoozePickerPanel" data-action="openSnoozePicker" data-unit="tab"
          title="Snooze the active tab">Tab</button>
        <button id="snoozeSelected" class="chip" aria-expanded="false" aria-controls="snoozePickerPanel" data-action="openSnoozePicker" data-unit="selected"
          title="Snooze all highlighted tabs">Selected</button>
        <button id="snoozeWindow" class="chip" aria-expanded="false" aria-controls="snoozePickerPanel" data-action="openSnoozePicker" data-unit="window"
          title="Snooze every tab in this window">Window</button>
        <button id="snoozeGroup" class="chip" aria-expanded="false" aria-controls="snoozePickerPanel" data-action="openSnoozePicker" data-unit="group"
          title="Snooze the active tab's group">Group</button>
      </div>
      <div id="snoozePickerPanel" hidden>
        <div class="presets">
          <button id="snoozePreset-laterToday" class="preset" disabled>Loading…</button>
          <button id="snoozePreset-tonight" class="preset" disabled>Loading…</button>
          <button id="snoozePreset-tomorrow" class="preset" disabled>Loading…</button>
          <button id="snoozePreset-weekend" class="preset" disabled>Loading…</button>
          <button id="snoozePreset-nextWeek" class="preset" disabled>Loading…</button>
        </div>
        <div class="custom-row">
          <input type="datetime-local" id="snoozeCustomTime" aria-label="Custom snooze time">
          <button id="snoozeCustomConfirm">Snooze</button>
          <button id="snoozePickerCancel">Cancel</button>
        </div>
        <div id="snoozeFeedback" role="status" aria-live="polite"></div>
      </div>
    </div>

    <div class="grp multi-window-section">
      <h3 class="section-head" data-group="purple"><span class="group-chip">All windows</span><span class="group-line"></span></h3>
      <div class="grid2">
        <button id="sortAllWindows" class="btn" data-action="sortAllWindows"
          title="Sort tabs in every window alphabetically by URL">Sort all windows</button>
        <button id="moveAllToSingleWindow" class="btn" data-action="moveAllToSingleWindow"
          title="Move all tabs from every window into the current window">Merge windows</button>
        <button id="removeDuplicatesAllWindows" class="btn" data-action="removeDuplicatesAllWindows"
          title="Remove duplicates within each window separately">Deduplicate per window</button>
        <button id="removeDuplicatesGlobally" class="btn" data-action="removeDuplicatesGlobally"
          title="Remove duplicates across all windows">Deduplicate globally</button>
      </div>
    </div>

    <div class="grp" id="sleepingSection" hidden>
      <div class="section-head" data-group="yellow">
        <h3 class="group-chip">Sleeping <span id="sleepingCount" class="count-pill">0</span></h3><span class="group-line"></span>
        <button id="expandSleeping" class="expand-link" data-action="openNapRoom"
          title="Open the full sleeping list in its own tab">Nap room <svg class="ico" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M6.5 3.5h6v6M12.5 3.5l-8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="sleep-wrap">
        <ul id="snoozedList"></ul>
      </div>
    </div>


    <div class="foot">
      <div class="stat">
        <div><b id="statusThisWindow"></b></div>
        <div class="multi-window-section"><span id="statusAllWindows"></span></div>
      </div>
      <div class="foot-right">
        <button type="button" id="openOptions" class="gear"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2 4h6.5M12.5 4H14M2 8h1.5M7.5 8H14M2 12h5.5M11.5 12H14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="10.5" cy="4" r="1.75" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="5.5" cy="8" r="1.75" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="9.5" cy="12" r="1.75" fill="none" stroke="currentColor" stroke-width="1.5"/></svg> Settings</button>
        <span id="openShortcut" class="open-shortcut" hidden></span>
      </div>
    </div>

    <!-- Feedback floats over the bottom edge instead of adding height. -->
    <div class="toasts">
      <div id="actionResult" class="action-result" role="status" aria-live="polite" hidden></div>
      <div id="copyFeedback" class="copy-feedback" role="status" aria-live="polite">Copied!</div>
      <div id="discardNotice" class="undo-notice" role="status" aria-live="polite" hidden>
        <span id="discardNoticeText"></span>
        <button id="discardUndo" data-action="undoDiscard">Undo</button>
      </div>
    </div>
