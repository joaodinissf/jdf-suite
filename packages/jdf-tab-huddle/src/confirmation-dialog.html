<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Huddle — Extract all domains</title>
  <link rel="stylesheet" href="huddle-theme.css">
  <style>
    /* Tokens, fonts, light/dark and the tab-group chips live in
       huddle-theme.css; this sheet is the dialog's layout only. */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
    }

    .page {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }

    .page-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .logo {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      display: block;
    }


    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.015em;
      line-height: 1.25;
    }

    /* A caution, not an error: an orange edge (decoration) on a panel. */
    .warning {
      background: var(--warn-soft);
      border: 1px solid var(--warn-edge);
      border-radius: 10px;
      padding: 14px 18px;
      margin: 0 0 28px;
    }

    .warning strong {
      display: block;
      font-size: 15px;
      margin-bottom: 2px;
    }

    #windowCount {
      color: var(--tx-dim);
    }

    /* Sections are tab groups: a Chrome-style group chip and its group line
       (see huddle-theme.css). */
    .section-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      font-size: 12px;
    }

    .section-head .group-chip {
      font-size: 12px;
      padding: 2px 8px;
    }

    .stats ul {
      margin: 0;
      padding-left: 20px;
    }

    .stats li {
      margin-bottom: 6px;
    }

    .stats li::marker {
      color: var(--tx-dim);
    }

    .actions {
      margin-top: 32px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      font: 600 14px/1.2 var(--ui);
      color: var(--tx);
      background: var(--comp);
      border: 1px solid var(--bd-control);
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      transition: background .12s, border-color .12s;
    }

    .btn:hover {
      background: var(--comp-hi);
      border-color: var(--bd-control-hi);
    }

    .btn.primary {
      background: var(--ac);
      border-color: var(--ac);
      color: var(--on-ac);
    }

    .btn.primary:hover {
      background: var(--ac-hi);
      border-color: var(--ac-hi);
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="page-head">
      <img class="logo" src="icons/huddle-mark.svg" alt="Huddle">
      <div>
        <h1>Extract all domains</h1>
      </div>
    </header>

    <div class="warning">
      <strong>Many windows will be created</strong>
      <span id="windowCount"></span>
    </div>

    <section class="stats">
      <h2 class="section-head" data-group="grey"><span class="group-chip">Summary</span><span class="group-line"></span></h2>
      <ul id="operationList">
      </ul>
    </section>

    <div class="actions">
      <button class="btn primary confirm" id="confirmButton">Proceed</button>
      <button class="btn cancel" id="cancelButton">Cancel</button>
    </div>
  </main>

  <script src="confirmation-dialog.js"></script>
</body>

</html>
