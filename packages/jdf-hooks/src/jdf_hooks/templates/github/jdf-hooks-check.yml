# ============================================================================
# JDF HOOKS DRIFT CHECK
# ============================================================================
# Generated by jdf-hooks (https://github.com/joaodinissf/jdf-suite)
# Fails when the generated hook files are stale, modified, or missing.
# Regenerate locally with: uvx jdf-hooks update
# ============================================================================
name: jdf-hooks
on:
  pull_request:
  schedule:
  - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC — catches new template releases
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v7
    - run: uvx jdf-hooks check
