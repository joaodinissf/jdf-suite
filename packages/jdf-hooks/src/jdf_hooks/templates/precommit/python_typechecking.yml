# ============================================================================
# PYTHON TYPE CHECKING
# ============================================================================
# Active: ty (Astral's Python type checker)
# ============================================================================
# Uses system-installed tools for consistency with lefthook
- repo: local
  hooks:
  - id: ty
    name: ty
    entry: ty check --force-exclude
    language: system
    types: [python]
    pass_filenames: true

