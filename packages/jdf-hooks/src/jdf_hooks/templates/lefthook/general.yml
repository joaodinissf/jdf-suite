# ============================================================================
# GENERAL FILE CHECKS
# ============================================================================
  - group:
      parallel: true
      jobs:
      - name: keep-sorted
        run: keep-sorted {staged_files}
      # The checks below are the same implementations pre-commit uses
      # (pre-commit-hooks on PyPI), run through uvx so they behave identically
      # on macOS and Linux. uvx caches the package after the first run.
      - name: check-yaml
        run: uvx --from pre-commit-hooks check-yaml {staged_files}
        glob: '*.{yml,yaml}'
      - name: end-of-file-fixer
        run: uvx --from pre-commit-hooks end-of-file-fixer {staged_files}
      - name: trailing-whitespace
        run: uvx --from pre-commit-hooks trailing-whitespace-fixer {staged_files}
        exclude: \.(md|markdown)$
      - name: mixed-line-ending
        run: uvx --from pre-commit-hooks mixed-line-ending --fix=lf {staged_files}
      - name: detect-private-key
        run: uvx --from pre-commit-hooks detect-private-key {staged_files}
      - name: detect-aws-credentials
        run: uvx --from pre-commit-hooks detect-aws-credentials --allow-missing-credentials {staged_files}
      - name: check-large-files
        run: uvx --from pre-commit-hooks check-added-large-files --maxkb=1000 {staged_files}
