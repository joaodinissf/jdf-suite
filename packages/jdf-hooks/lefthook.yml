# ============================================================================
# LEFTHOOK CONFIGURATION
# ============================================================================
# Generated by jdf-hooks (https://github.com/joaodinissf/jdf-suite)
#
# Run: lefthook install
# Test: lefthook run pre-commit --all-files
# ============================================================================
pre-commit:
  jobs:
# ============================================================================
# PYTHON
# ============================================================================
  - group:
      parallel: false
      jobs:
      - name: pycln
        run: pycln --all {staged_files}
        glob: '*.py'
      - name: isort
        run: isort --filter-files {staged_files}
        glob: '*.py'
      - name: ruff-format
        run: ruff format --force-exclude {staged_files}
        glob: '*.{py,pyi}'
# ============================================================================
# PYTHON TYPE CHECKING
# ============================================================================
  - group:
      parallel: true
      jobs:
      - name: ruff-check
        run: ruff check --force-exclude {staged_files}
        glob: '*.{py,pyi}'
      - name: ty
        run: ty check --force-exclude {staged_files}
        glob: '*.py'
